name: Model info
on:
  push:
    branches: [model-info]
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: DuckDuckGo HTML sample
        run: |
          UA="Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Mobile Safari/537.36"
          curl -s -A "$UA" -o ddg.html -w "status %{http_code} size %{size_download}\n" "https://html.duckduckgo.com/html/?q=who+is+the+current+president+of+france"
          echo "=== result blocks: $(grep -c 'class="result__a"' ddg.html)"
          python3 - <<'PY'
          s=open('ddg.html',encoding='utf-8',errors='replace').read()
          i=s.find('class="result__a"')
          print(s[max(0,i-1500):i+2500] if i>=0 else s[:3000])
          PY
          echo "=== POST"
          curl -s -A "$UA" -o ddg2.html -w "status %{http_code} size %{size_download}\n" -d "q=pizza+dough+recipe" "https://html.duckduckgo.com/html/"
          echo "result blocks: $(grep -c 'class="result__a"' ddg2.html)"
          echo "=== lite"
          curl -s -A "$UA" -o lite.html -w "status %{http_code} size %{size_download}\n" "https://lite.duckduckgo.com/lite/?q=pizza+dough+recipe"
          echo "lite result-link: $(grep -c 'result-link' lite.html)"
      - name: Wikipedia sample
        run: |
          curl -s -A "Shuttle/0.1 (https://github.com/jawsh207/Shuttle)" "https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&generator=search&gsrsearch=current+president+of+france&gsrlimit=3&prop=extracts|info&inprop=url&exintro=1&explaintext=1&exsentences=3&exlimit=3" | head -c 2500
